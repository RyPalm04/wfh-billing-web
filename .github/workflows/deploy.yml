  name: Test and Deploy to Vercel

  on:
    push:
      tags:
        - 'v*-beta*'
        - 'v*-rc*'
        - 'v*'
  
  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '22'
        - name: Install dependencies
          run: npm ci
        - name: Run tests
          run: npm test

    deploy-preview:
      needs: test
      if: contains(github.ref, 'beta') || contains(github.ref, 'rc')      
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '22'
        - name: Install Vercel CLI
          run: npm install -g vercel
        - name: Deploy to Vercel Preview
          id: deploy
          run: echo "url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
          env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        - name: Alias deployment  
          run: |
            TAG=${GITHUB_REF#refs/tags/}
            BETA_PART=$(echo $TAG | grep -o 'beta\.[0-9]*' | tr -d '.')
            vercel alias set ${{ steps.deploy.outputs.url }} wfh-billing-git-${BETA_PART}.vercel.app --token=${{ secrets.VERCEL_TOKEN }}

    deploy-production:
      needs: test
      if: contains(github.ref, 'beta') == false && contains(github.ref, 'rc') == false
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '22'
        - name: Install Vercel CLI
          run: npm install -g vercel
        - name: Deploy to Vercel Production
          run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}